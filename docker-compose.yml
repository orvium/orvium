services:
  nginx:
    build:
      context: .
      dockerfile: ./Dockerfile-nginx
    ports:
      - '80:80'
    depends_on:
      - front
      - api
      - agent
    networks:
      - app-network

  front:
    build:
      context: .
      dockerfile: ./apps/orvium-ui/Dockerfile
      args:
        NG_APP_NAME: 'development'
        NG_APP_PRODUCTION: 'false'
        NG_APP_EXPERIMENTAL_FEATURES: 'true'
        NG_APP_SERVICE_WORKERS: 'false'
        NG_APP_PUBLIC_URL: 'http://localhost'
        NG_APP_API_ENDPOINT: 'http://localhost/api/v1'
        NG_APP_VAPID_KEY: 'dummy'
        NG_APP_AUTH_CLIENT_ID: '2wOhAjxxxxxxxxxxxxxxx'
        NG_APP_AUTH_CLIENT_DOMAIN: 'dev.us.auth0.com'
        NG_APP_AUTH_AUDIENCE: 'https://dev.us.auth0.com/api/v2/'
        NG_APP_AUTH_ISSUER: 'https://dev.us.auth0.com'
        NG_APP_AUTH_LOGOUT_URL: 'https://dev.us.auth0.com/v2/logout'
        NG_APP_AUTH_REDIRECT: 'http://localhost/'
        NG_APP_SENTRY_DSN: 'dummy'
        NG_APP_SENTRY_SAMPLE: '0'
        NG_APP_LOG_LEVEL: '1'
        NG_APP_TINYMCE_KEY: 'foobar'
        NG_APP_S3_BUCKET: 'http://minio.local/public-api-files'
        NG_APP_SHOW_FEATURED_COMMUNITIES: false
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile-api
    networks:
      - app-network
    environment: &default_env
      ENVIRONMENT: production
      MONGO_URI: mongodb://mongodb:27017/orvium
      SMTP: '{"host":"smtp.ethereal.email","port":587,"auth":{"user":"someuser@ethereal.email","pass":"xxxxxxxxxxxxxx"}}'
      STRIPE: '{"publishableKey":"pk_test_xxxxxxxxxxxxx", "key":"sk_test_xxxxxxxxxxxxxxxxx","webhookSecretDirect":"whsec_xxxxxxxxxxxxxxxxxxxxxxxxxxxxx","webhookSecretConnect":"whsec_xxxxxxxxxxxxxxxxxxxxxxx"}'
      SENTRY_DSN: https://xxxxxxxxxxxxxxxxxx.ingest.sentry.io/xxxxxxx
      AWS_ENDPOINT_URL: http://minio.local:9000
      S3_FILES_BUCKET: api-files
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_REGION_APP: 'us-east-1'
      AUTH0_AUDIENCE: 'https://dev.us.auth0.com/api/v2/'
      AUTH0_ISSUER: 'https://dev.us.auth0.com/'
      AUTH0_CLIENT_DOMAIN: 'dev.us.auth0.com'
      SECRET_KEY: 'foobar'
      PUBLIC_URL: http://localhost
      PUSH_NOTIFICATIONS_PRIVATE_KEY: xxxxxxxxxxxxxxxxxx
      SENDER_EMAIL: noreply@orvium.io
      ADMIN_EMAIL: myemail@orvium.io
      CONVERTAPI_KEY: fake
      DATACITE_PUBLISHER: 'My publishing house'
      ITHENTICATE_SIGNING_SECRET: 'dummy'
      ITHENTICATE_ENDPOINT: 'dummy'
      ITHENTICATE_SERVICE_NAME: 'dummy'
      ITHENTICATE_SERVICE_VERSION: 'dummy'


  base:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile-base
    image: orvium-agent-base:latest
    networks:
      - app-network

  agent:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile-agent
    networks:
      - app-network
    depends_on:
      - api
      - base
    environment:
      <<: *default_env

  mongodb:
    image: mongo:latest
    container_name: mongodb-api
    ports:
      - '27017:27017'
    networks:
      - app-network
    volumes:
      - mongo-data:/data/db
    command: mongod --quiet --logpath /var/log/mongodb/mongod.log

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
  minio-data:
